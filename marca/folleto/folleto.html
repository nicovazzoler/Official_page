<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<title>Folleto Vazzoler A6</title>
<!--
  Folleto A6 (105 × 148 mm) frente y dorso, con los colores y tipografías de la página.
  Cada cara se dibuja con 3 mm de sangrado (111 × 154 mm). El script del final la acomoda según ?modo=:
    vista     las dos caras recortadas, para mirar en pantalla (por defecto)
    imprenta  una cara por hoja, con sangrado y marcas de corte
    a4        4 frentes en una hoja A4 y 4 dorsos en la otra, al tamaño exacto
  generar.mjs abre este archivo con cada modo y guarda los PDF.
-->
<style>
@font-face { font-family: 'Space Grotesk'; src: url('../../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 300 700; }
@font-face { font-family: 'Space Mono'; src: url('../../node_modules/@fontsource/space-mono/files/space-mono-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Space Mono'; src: url('../../node_modules/@fontsource/space-mono/files/space-mono-latin-700-normal.woff2') format('woff2'); font-weight: 700; }

:root {
  --negro: #030405;
  --navy: #060E1E;
  --texto: #EEF3F8;
  --suave: #A9B8CC;
  --linea: rgb(154 171 194 / 0.28);
  --turquesa: #5EEAD4;
  --lima: #D4EE5E;
  --display: 'Space Grotesk', sans-serif;
  --mono: 'Space Mono', monospace;
  --margen: 6.5mm; /* zona segura: nada importante más cerca del corte */
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; font-family: var(--display); color: var(--texto); }
h1, h2, p { margin: 0; }

/* Una cara con sangrado; .recorte es el A6 final */
.cara { position: relative; width: 111mm; height: 154mm; overflow: hidden; }
.recorte { position: absolute; left: 3mm; top: 3mm; width: 105mm; height: 148mm; }

/* ---------- Frente ---------- */
.frente {
  background:
    radial-gradient(42mm 42mm at 55.5mm 54mm, rgb(212 238 94 / 0.13), transparent 100%),
    radial-gradient(60mm 50mm at 0mm 154mm, rgb(60 110 230 / 0.22), transparent 100%),
    var(--negro);
}
.cabecera { position: absolute; left: var(--margen); right: var(--margen); top: var(--margen); display: flex; justify-content: space-between; align-items: center; }
.marca { display: flex; align-items: center; gap: 2.4mm; }
.marca svg { width: 9.5mm; height: 9.5mm; }
.marca b { display: block; font-weight: 600; font-size: 14pt; letter-spacing: -0.03em; line-height: 1; }
.marca small { display: block; font-size: 6.5pt; color: var(--suave); margin-top: 0.8mm; letter-spacing: 0.02em; }
.zona { display: flex; align-items: center; gap: 1.2mm; font-size: 7.5pt; color: var(--suave); }
.zona svg { width: 3.4mm; height: 3.4mm; color: var(--turquesa); }

.escena { position: absolute; left: 50%; top: 14mm; width: 76mm; height: 76mm; transform: translateX(-50%); }
.escena .esfera { position: absolute; inset: 0; width: 100%; height: 100%; }
.escena .robot { position: absolute; left: 50%; top: 5.5mm; width: 49mm; transform: translateX(-50%); }

.texto-frente { position: absolute; left: var(--margen); right: var(--margen); bottom: var(--margen); display: grid; gap: 3.2mm; }
.titular { font-weight: 600; font-size: 29pt; line-height: 0.98; letter-spacing: -0.05em; }
.titular span { display: block; }
.acento { color: var(--turquesa); }
.bajada { font-size: 8.5pt; line-height: 1.4; color: var(--suave); max-width: 80mm; }
.web { display: flex; align-items: center; gap: 1.6mm; font: 700 8pt var(--mono); color: var(--turquesa); }
.web svg { width: 3mm; height: 3mm; }

/* ---------- Dorso ---------- */
.dorso {
  background:
    radial-gradient(60mm 46mm at 111mm 0mm, rgb(60 110 230 / 0.26), transparent 100%),
    radial-gradient(50mm 40mm at 0mm 154mm, rgb(94 234 212 / 0.10), transparent 100%),
    var(--navy);
}
.contenido-dorso { position: absolute; inset: var(--margen); display: flex; flex-direction: column; }
.dorso h2 { font-weight: 600; font-size: 17pt; line-height: 1.02; letter-spacing: -0.045em; }
.dorso .intro { margin-top: 2mm; font-size: 7.8pt; line-height: 1.4; color: var(--suave); }

/* Árbol de servicios, igual que la página en el celu */
.arbol { margin-top: 5.5mm; }
.raiz { display: flex; align-items: center; gap: 2mm; font: 7pt var(--mono); color: var(--suave); }
.raiz svg { width: 5.5mm; height: 5.5mm; }
.raiz b { color: var(--texto); font-weight: 400; }
.items { list-style: none; margin: 0 0 0 2.7mm; padding: 0; }
.items li { position: relative; padding: 2.1mm 0 2.2mm 5.2mm; }
.items li::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; border-left: 0.25mm solid var(--linea); }
.items li::after { content: ''; position: absolute; left: 0; top: 4.2mm; width: 3.4mm; border-top: 0.25mm solid var(--linea); }
.items li:last-child::before { bottom: auto; height: 4.2mm; }
.cmd { display: flex; align-items: center; gap: 1.6mm; font: 9pt / 1.25 var(--mono); }
.cmd svg { flex: none; width: 2.2mm; height: 2.2mm; color: var(--turquesa); }
.det { font: 7pt / 1.35 var(--mono); color: var(--suave); padding-left: 3.8mm; margin-top: 0.4mm; }
.extra .cmd, .extra .det { color: var(--turquesa); }
.cursor { display: inline-block; width: 1.5mm; height: 2.8mm; margin-left: 0.6mm; vertical-align: -0.5mm; background: var(--turquesa); }

/* QR y contacto */
.contacto { margin-top: auto; display: flex; align-items: center; gap: 4mm; }
.qr { flex: none; width: 29mm; height: 29mm; padding: 2.4mm; border-radius: 2.6mm; background: #FFFFFF; }
.qr svg { display: block; width: 100%; height: 100%; }
.datos { display: grid; gap: 2mm; min-width: 0; }
.datos b { font-weight: 600; font-size: 10.5pt; line-height: 1.12; letter-spacing: -0.02em; }
.linea-dato { display: flex; align-items: center; gap: 1.6mm; font: 7.6pt var(--mono); color: var(--suave); }
.linea-dato svg { flex: none; width: 3.4mm; height: 3.4mm; color: var(--turquesa); }
.linea-dato.web-dorso { color: var(--turquesa); font-weight: 700; }

/* ---------- Modos ---------- */
.vista { background: #2B2F36; display: flex; flex-wrap: wrap; gap: 10mm; padding: 10mm; }
.ventana { position: relative; width: 105mm; height: 148mm; overflow: hidden; }
.ventana .cara { position: absolute; left: -3mm; top: -3mm; }
.vista .ventana { box-shadow: 0 2mm 8mm rgb(0 0 0 / 0.5); }

.hoja { position: relative; overflow: hidden; break-after: page; }
.hoja:last-child { break-after: auto; }
.hoja-imprenta { width: 121mm; height: 164mm; background: #FFFFFF; }
.hoja-imprenta .cara { position: absolute; left: 5mm; top: 5mm; }
.marca-corte { position: absolute; background: #000000; }
.hoja-a4 { width: 210mm; height: 297mm; background: #FFFFFF; display: grid; grid-template-columns: 105mm 105mm; grid-auto-rows: 148mm; align-content: start; }
</style>
</head>

<script>
// Esfera de puntos con los colores del robot, como en la portada de la página pero quieta y en vectores.
function esfera(svg) {
  const ns = 'http://www.w3.org/2000/svg';
  const paleta = ['#DDB35C', '#86B6F2', '#C9C6BA', '#4FCDB4', '#D4EE5E'];
  const N = 900, oro = Math.PI * (3 - Math.sqrt(5)), R = 216, t = 2000;
  const cg = Math.cos(0.7), sg = Math.sin(0.7), ci = Math.cos(0.38), si = Math.sin(0.38);
  for (let i = 0; i < N; i++) {
    const y0 = 1 - (2 * (i + 0.5)) / N, r = Math.sqrt(1 - y0 * y0), a = i * oro;
    let x = Math.cos(a) * r, y = y0, z = Math.sin(a) * r;
    const d = 1 + 0.09 * Math.sin(3 * x + t * 0.0006) * Math.cos(2 * y + t * 0.0004) + 0.05 * Math.sin(4 * z - t * 0.0005);
    x *= d; y *= d; z *= d;
    const x1 = x * cg - z * sg, z1 = x * sg + z * cg;
    const y2 = y * ci - z1 * si, z2 = y * si + z1 * ci;
    const f = 3 / (3 - z2), cerca = (z2 + 1) / 2, lado = 1.1 + 1.9 * cerca;
    const p = document.createElementNS(ns, 'rect');
    p.setAttribute('x', (270 + x1 * R * f).toFixed(1));
    p.setAttribute('y', (270 + y2 * R * f).toFixed(1));
    p.setAttribute('width', lado.toFixed(2));
    p.setAttribute('height', lado.toFixed(2));
    p.setAttribute('fill', paleta[(i * 7) % 5]);
    p.setAttribute('opacity', (0.1 + 0.55 * cerca * cerca).toFixed(2));
    svg.append(p);
  }
}

const cara = (id) => {
  const nodo = document.getElementById(id).content.firstElementChild.cloneNode(true);
  nodo.querySelectorAll('.esfera').forEach(esfera);
  return nodo;
};
const ventana = (id) => {
  const v = document.createElement('div');
  v.className = 'ventana';
  v.append(cara(id));
  return v;
};
const pagina = (ancho, alto) => {
  const s = document.createElement('style');
  s.textContent = `@page { size: ${ancho} ${alto}; margin: 0; }`;
  document.head.append(s);
};

const modo = new URLSearchParams(location.search).get('modo') || 'vista';

if (modo === 'imprenta') {
  // Una cara por hoja: sangrado de 3 mm y marcas de corte en el margen blanco de 5 mm.
  pagina('121mm', '164mm');
  for (const id of ['frente', 'dorso']) {
    const hoja = document.createElement('div');
    hoja.className = 'hoja hoja-imprenta';
    hoja.append(cara(id));
    const corte = { x: [8, 113], y: [8, 156] }; // líneas de corte, en mm desde el borde de la hoja
    for (const x of corte.x) for (const y0 of [0.5, 160]) hoja.append(marca(x, y0, 0.15, 3.5));
    for (const y of corte.y) for (const x0 of [0.5, 117]) hoja.append(marca(x0, y, 3.5, 0.15));
    document.body.append(hoja);
  }
} else if (modo === 'a4') {
  // 4 por hoja al tamaño exacto: la hoja doblada en cuatro marca los cortes.
  pagina('210mm', '297mm');
  for (const id of ['frente', 'dorso']) {
    const hoja = document.createElement('div');
    hoja.className = 'hoja hoja-a4';
    for (let i = 0; i < 4; i++) hoja.append(ventana(id));
    document.body.append(hoja);
  }
} else {
  document.body.className = 'vista';
  document.body.append(ventana('frente'), ventana('dorso'));
}

function marca(x, y, ancho, alto) {
  const m = document.createElement('span');
  m.className = 'marca-corte';
  // las verticales se centran en x; las horizontales, en y
  const vertical = ancho < alto;
  m.style.left = (vertical ? x - ancho / 2 : x) + 'mm';
  m.style.top = (vertical ? y : y - alto / 2) + 'mm';
  m.style.width = ancho + 'mm';
  m.style.height = alto + 'mm';
  return m;
}
</script>
</body>
