<!doctype html>

<meta charset="utf-8">
<title>Folleto Vazzoler A6</title>
<!--
  Folleto A6 (105 × 148 mm). El diseño es el del canvas "Folleto Vazzoler" (artboard oscuro, 559 × 794 px)
  y acá se escala a A6, con 3 mm de sangrado (111 × 154 mm). El script del final lo acomoda según ?modo=:
    vista     recortado, para mirar en pantalla (por defecto)
    imprenta     1 folleto con sangrado y marcas de corte
    a4-imprenta  2 en una A4 apaisada, con sangrado y marcas de corte
    a4           4 en una hoja A4, al tamaño exacto y sin sangrado (para imprimir en casa)
  generar.cjs abre este archivo con cada modo y guarda los PDF.
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

/* El folleto con sangrado. El diseño se escala por el alto: 148 mm / 794 px (A6 es apenas más ancho que A5
   en proporción, así que sobra 0,4 mm de cada lado y lo cubre el mismo fondo). */
.cara { position: relative; width: 111mm; height: 154mm; overflow: hidden; background: #0B2530; }
.diseno { position: absolute; top: 3mm; left: calc(3mm + (105mm - 559px * 0.704497) / 2); width: 559px; height: 794px; transform: scale(0.704497); transform-origin: 0 0; }

/* ---------- Modos ---------- */
.vista { background: #2B2F36; padding: 10mm; }
.ventana { position: relative; width: 105mm; height: 148mm; overflow: hidden; }
.ventana .cara { position: absolute; left: -3mm; top: -3mm; }
.vista .ventana { box-shadow: 0 2mm 8mm rgb(0 0 0 / 0.5); }

.hoja { position: relative; overflow: hidden; }
.hoja-imprenta { width: 121mm; height: 164mm; background: #FFFFFF; }
.hoja-imprenta .cara { position: absolute; left: 5mm; top: 5mm; }
.marca-corte { position: absolute; background: #000000; }
.hoja-a4-imprenta { width: 297mm; height: 210mm; background: #FFFFFF; }
.hoja-a4 { width: 210mm; height: 297mm; background: #FFFFFF; display: grid; grid-template-columns: 105mm 105mm; grid-auto-rows: 148mm; align-content: start; }
</style>
</head>

          <span>Sistema de ventas, clientes, sueldos y stock</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.3">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5EEAD4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 2px"><path d="M5 12l4 4 10-10"></path></svg>
          <span>Tu página web o catálogo, con botón directo a tu WhatsApp</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.3">

          <span>Tareas repetitivas, automatizadas</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.3">

        <div style="flex: none; width: 132px; height: 132px; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; padding: 12px"><svg viewBox="0 0 25 25" shape-rendering="crispEdges" role="img" aria-label="Código QR a vazzoler.com.ar" style="display: block; width: 100%; height: 100%"><path stroke="#0B2530" d="M0 0.5h7m4 0h1m2 0h2m2 0h7M0 1.5h1m5 0h1m1 0h1m1 0h1m1 0h1m2 0h1m2 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m2 0h1m1 0h1m3 0h1m2 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m3 0h3m1 0h1m3 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m1 0h3m2 0h4m1 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m4 0h1m2 0h2m2 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M9 7.5h1m2 0h3M0 8.5h1m1 0h1m1 0h1m1 0h1m2 0h1m2 0h2m6 0h1m2 0h1M2 9.5h3m7 0h1m3 0h3m5 0h1M1 10.5h1m1 0h4m3 0h2m6 0h1m3 0h3M1 11.5h1m2 0h2m1 0h1m1 0h1m1 0h6m6 0h1M0 12.5h1m2 0h1m1 0h2m5 0h3m1 0h4m1 0h1m1 0h2M5 13.5h1m1 0h2m1 0h3m3 0h1m1 0h1m2 0h1m2 0h1M0 14.5h1m1 0h5m4 0h3m2 0h1m2 0h1m2 0h3M1 15.5h3m1 0h1m2 0h2m2 0h2m1 0h4m1 0h1m2 0h1M0 16.5h1m2 0h1m2 0h2m2 0h2m1 0h1m1 0h7M8 17.5h2m1 0h1m1 0h1m1 0h2m3 0h2m1 0h2M0 18.5h7m2 0h1m4 0h3m1 0h1m1 0h2m1 0h2M0 19.5h1m5 0h1m2 0h1m1 0h1m1 0h2m1 0h1m3 0h2m2 0h1M0 20.5h1m1 0h3m1 0h1m1 0h1m1 0h1m1 0h2m2 0h6m1 0h2M0 21.5h1m1 0h3m1 0h1m4 0h4m1 0h1m2 0h4M0 22.5h1m1 0h3m1 0h1m1 0h2m1 0h5m1 0h1m2 0h1m3 0h1M0 23.5h1m5 0h1m3 0h1m1 0h2m1 0h4m1 0h2m1 0h1M0 24.5h7m1 0h2m1 0h2m1 0h3m2 0h1m3 0h2"></path></svg></div>

<script>
const folleto = () => document.getElementById('folleto').content.firstElementChild.cloneNode(true);
const ventana = () => {
  const v = document.createElement('div');
  v.className = 'ventana';
  v.append(folleto());
  return v;
};
const pagina = (ancho, alto) => {
  const s = document.createElement('style');
  s.textContent = `@page { size: ${ancho} ${alto}; margin: 0; }`;
  document.head.append(s);
};
// Marca de corte: las verticales se centran en x; las horizontales, en y.
function marca(x, y, ancho, alto) {
  const m = document.createElement('span');
  const vertical = ancho < alto;
  m.className = 'marca-corte';
  m.style.left = (vertical ? x - ancho / 2 : x) + 'mm';
  m.style.top = (vertical ? y : y - alto / 2) + 'mm';
  m.style.width = ancho + 'mm';
  m.style.height = alto + 'mm';
  return m;
}

const modo = new URLSearchParams(location.search).get('modo') || 'vista';

if (modo === 'imprenta') {
  // Sangrado de 3 mm y marcas de corte en el margen blanco de 5 mm.
  pagina('121mm', '164mm');
  const hoja = document.createElement('div');
  hoja.className = 'hoja hoja-imprenta';
  hoja.append(folleto());
  const corte = { x: [8, 113], y: [8, 156] }; // líneas de corte, en mm desde el borde de la hoja
  for (const x of corte.x) for (const y0 of [0.5, 160]) hoja.append(marca(x, y0, 0.15, 3.5));
  for (const y of corte.y) for (const x0 of [0.5, 117]) hoja.append(marca(x0, y, 3.5, 0.15));
  document.body.append(hoja);
} else if (modo === 'a4-imprenta') {
  // A4 apaisada con 2 folletos, cada uno con su sangrado y 4 mm de aire entre los dos.
  // Con sangrado no entran 4 en una A4 (harían falta 222 × 308 mm).
  pagina('297mm', '210mm');
  const hoja = document.createElement('div');
  hoja.className = 'hoja hoja-a4-imprenta';
  const izquierda = 35.5, arriba = 28, separacion = 4;
  const corteX = [];
  for (let i = 0; i < 2; i++) {
    const c = folleto();
    const x = izquierda + i * (111 + separacion);
    c.style.cssText = `position: absolute; left: ${x}mm; top: ${arriba}mm`;
    hoja.append(c);
    corteX.push(x + 3, x + 108);
  }
  const corteY = [arriba + 3, arriba + 151];
  // Las marcas quedan afuera del sangrado: arriba y abajo de cada corte vertical, a los costados de los horizontales.
  for (const x of corteX) for (const y0 of [arriba - 8, arriba + 156]) hoja.append(marca(x, y0, 0.15, 6));
  for (const y of corteY) for (const x0 of [izquierda - 9, izquierda + 226 + 3]) hoja.append(marca(x0, y, 6, 0.15));
  document.body.append(hoja);
} else if (modo === 'a4') {
  // 4 por hoja al tamaño exacto, sin sangrado: para imprimir en casa; la hoja doblada en cuatro marca los cortes.
  pagina('210mm', '297mm');
  const hoja = document.createElement('div');
  hoja.className = 'hoja hoja-a4';
  for (let i = 0; i < 4; i++) hoja.append(ventana());
  document.body.append(hoja);
} else {
  document.body.className = 'vista';
  document.body.append(ventana());
}
</script>
